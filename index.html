<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multiples</title>
</head>
<body>

    <h1>Excercises 1</h1>
    <h2>Multiples of 3 or 5</h2>
    <p id="result"></p>

    <script>
        let multiples = [];

        for (let n = 1; n < 1000; n++) {
            if (n % 3 === 0 || n % 5 === 0) {
                multiples.push(n);
            }
        }

       
        document.getElementById("result").textContent = multiples.join(", ");
    </script>


    <h1>Exercise 2</h1>
<h2>Addition of X and Y below n</h2>

<label>X:</label>
<input type="number" id="x">
<br>

<label>Y:</label>
<input type="number" id="y">
<br>

<label>Z:</label>
<input type="number" id="z">
<br>

<button onclick="f()">Submit</button>

<p id="results2"></p>

<script>
    let f = () => {

        let x = parseInt(document.getElementById('x').value);
        let y = parseInt(document.getElementById('y').value);
        let z = parseInt(document.getElementById('z').value);

        let result = [];

        for (let n = 1; n < z; n++) {
            if (n % x === 0 || n % y === 0) {
                result.push(n);
            }
        }

        document.getElementById("results2").textContent = result.join(", ");
    }
   
</script>

     <h1>Exercise 3</h1>
    <h2>Euler List 1</h2>

    <p id="results3"></p>

    <script>

        let listEuler1 = (a, b, l) => {

            let sum = 0;

            for (let n of l) {
                if (n % a === 0 || n % b === 0) {
                    sum += n;
                }
            }

            return sum;
        };


        let eulerlist = () => {

            let a = 2;
            let b = 3;
            let l = [1, 2, 3, 4, 5, 6, 7, 9, 10, 10, 10];

            let answer = listEuler1(a, b, l);


           document.getElementById("results3").textContent = answer;
        };

        eulerlist();

    </script>

<h1>Exercise 6</h1>
<h2>Basket Total</h2>

<p id="results6"></p>

<button id="currencyButton">Change Currency</button>

<script>
    let total = (basket, prices) => {
        let cost = 0;

        for (let key in basket) {
            cost += basket[key] * prices[key];
        }

        return cost;
    };

    let basket = {
        milk: 2,
        meat: 4,
        bread: 2,
        eggs: 1
    };

    let prices = {
        milk: 3.20,
        meat: 4.50,
        bread: 1.90,
        eggs: 1.60
    };

    let answer = total(basket, prices);

    document.getElementById("results6").textContent =
        "Total: €" + answer.toFixed(2);


    document.getElementById("currencyButton").addEventListener("click", function () {

        document.getElementById("results6").textContent =
            "Changing currency...";

      fetch("https://api.exchangerate-api.com/v4/latest/EUR")
    .then(response => response.json())
    .then(data => {

        let rate = data.rates.USD;
        let convertedTotal = answer * rate;

        document.getElementById("results6").textContent =
            "Total: $" + convertedTotal.toFixed(2);
    })
    .catch(error => {

        console.error(error);

        document.getElementById("results6").textContent =
            "Currency conversion failed: " + error.message;
    });

    });
</script>
